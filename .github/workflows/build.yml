name: Build Windows Installer

# Запускається, коли ви пушите тег виду v2.0.1 (або вручну через кнопку Run workflow).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # потрібно, щоб викласти .exe у Releases

jobs:
  build-win:
    runs-on: windows-latest   # раннер Windows має Python + VS Build Tools для ATEM
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # atem-connection (optionalDependencies) тягне нативний модуль
      # @julusian/freetype2, який electron-builder перекомпільовує під ABI
      # Electron. На поточному образі windows-latest node-gyp не може ні
      # знайти, ні розпізнати версію встановленої Visual Studio (перевірено:
      # ілammy/msvc-dev-cmd + свіжий node-gyp обидва не допомогли — 2026-08-20),
      # тож інсталятор збирається БЕЗ optionalDependencies. Це означає, що
      # керування ATEM-мікшером і ONVIF/PTZ-камерами не працюватиме в .exe,
      # зібраному цим workflow, поки хтось не розбереться з нативною збіркою
      # на Windows-раннері. npm НЕ впаде через це (пакети optional).
      - name: Install dependencies
        run: npm install --omit=optional --no-audit --no-fund

      - name: Run smoke tests
        run: npm test

      # electron-builder бере owner/repo з "publish" у package.json і
      # використовує GH_TOKEN, щоб залити .exe та latest.yml (автооновлення)
      # до релізу з відповідним тегом.
      - name: Build & publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish-win
