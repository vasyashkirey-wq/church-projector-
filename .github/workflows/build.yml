name: Build Desktop Installers (Windows + macOS)

# Запускається, коли ви пушите тег виду v2.0.1 (або вручну через кнопку Run workflow).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # потрібно, щоб викласти .exe/.dmg у Releases

jobs:
  build-win:
    runs-on: windows-latest   # раннер Windows має Python + VS Build Tools для ATEM
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # atem-connection (optionalDependencies) тягне нативний модуль
      # @julusian/freetype2, який electron-builder перекомпільовує під ABI
      # Electron. На поточному образі windows-latest node-gyp не може ні
      # знайти, ні розпізнати версію встановленої Visual Studio (перевірено:
      # ілammy/msvc-dev-cmd + свіжий node-gyp обидва не допомогли — 2026-08-20),
      # тож інсталятор збирається БЕЗ optionalDependencies. Це означає, що
      # керування ATEM-мікшером і ONVIF/PTZ-камерами не працюватиме в .exe,
      # зібраному цим workflow, поки хтось не розбереться з нативною збіркою
      # на Windows-раннері. npm НЕ впаде через це (пакети optional).
      - name: Install dependencies
        run: npm install --omit=optional --no-audit --no-fund

      - name: Run smoke tests
        run: npm test

      # electron-builder бере owner/repo з "publish" у package.json і
      # використовує GH_TOKEN, щоб залити .exe та latest.yml (автооновлення)
      # до релізу з відповідним тегом.
      - name: Build & publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish-win

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # На відміну від Windows-джоби, тут НЕ пропускаємо optionalDependencies:
      # dmg-builder (частина electron-builder) залежить від dmg-license, який
      # сам є optional-пакетом — без нього збірка .dmg падає з "Cannot find
      # module 'dmg-license'". atem-connection/onvif теж спокійно компілюються
      # на macOS.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run smoke tests
        run: npm test

      # Apple-акаунта (сертифіката Developer ID) поки немає, тому збірка
      # непідписана: CSC_IDENTITY_AUTO_DISCOVERY=false вимикає спроби
      # electron-builder знайти сертифікат і підписати застосунок під час
      # збірки в CI. Як відкрити непідписаний .dmg на Mac — див. macOS-ЗАПУСК.md.
      - name: Build & publish macOS app (.dmg + .zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run publish-mac
