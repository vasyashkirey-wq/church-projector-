<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stage Display</title>
<style>
  body { margin:0; background:#0a0a1a; color:#fff; font-family:Georgia,serif; height:100vh; display:flex; flex-direction:column; padding:16px 30px; box-sizing:border-box; overflow:hidden; }
  .header { display:flex; justify-content:space-between; color:#c8a84b; font-size:2.2vh; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:6px; }
  .main { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .label { color:rgba(255,255,255,0.3); font-size:1.8vh; letter-spacing:2px; }
  .current { font-size:5vh; line-height:1.3; margin:4px 0; max-width:85%; }
  .next-box { border-top:1px solid rgba(255,255,255,0.03); padding-top:6px; }
  .next-label { color:rgba(255,255,255,0.3); font-size:1.6vh; }
  .next-text { color:rgba(255,255,255,0.45); font-size:2.6vh; }
  .footer { display:flex; justify-content:space-between; border-top:1px solid rgba(255,255,255,0.03); padding-top:6px; font-size:1.8vh; color:rgba(255,255,255,0.4); }
  .timer { font-family:monospace; font-size:3vh; color:#f56565; }
</style>
</head>
<body>
  <div class="header"><span>⛪ Церква Прага</span><span id="stageClock">00:00</span></div>
  <div class="main">
    <div class="label">📖 ПОТОЧНИЙ</div>
    <div class="current" id="stageCurrent">—</div>
    <div class="next-box">
      <div class="next-label">▶ НАСТУПНИЙ</div>
      <div class="next-text" id="stageNext">—</div>
    </div>
  </div>
  <div class="footer"><span id="stageNotes">📝</span><span class="timer" id="stageTimer">⏱ --:--</span></div>
<script>
  setInterval(function () {
    document.getElementById('stageClock').textContent = new Date().toLocaleTimeString('uk-UA');
  }, 1000);
  if (window.stageAPI && window.stageAPI.onContent) {
    window.stageAPI.onContent(function (data) {
      if (!data) return;
      // textContent, НЕ innerHTML — навіть якщо колись сюди потрапить неескейпнутий
      // текст, він не виконається як розмітка (contextIsolation тут увімкнено, але
      // зайва обережність не завадить).
      if (data.current != null) document.getElementById('stageCurrent').textContent = data.current;
      if (data.next != null) document.getElementById('stageNext').textContent = data.next;
      if (data.timer != null) document.getElementById('stageTimer').textContent = '⏱ ' + data.timer;
      if (data.notes != null) document.getElementById('stageNotes').textContent = '📝 ' + data.notes;
    });
  }
</script>
</body>
</html>
