<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100vh; background:#000; overflow:hidden; }

/* ШАРИ (знизу вгору): відео-фон → фон теми → затемнення → контент →
   логотип → заморожений кадр → оголошення поверх слайда */

#bg-video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none; }
#proj-bg  { position:fixed; inset:0; background:#000; background-size:cover; background-position:center; z-index:1; }
#proj-dim { position:fixed; inset:0; z-index:2; pointer-events:none; }

#content { position:relative; z-index:3; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
#text-wrap { display:none; text-align:center; padding:60px 100px; width:100%; opacity:0; transition:opacity .6s; }
#text-wrap.show { opacity:1; }
#text-ref  { color:#c8a84b; font-size:24px; margin-bottom:18px; font-family:Georgia,serif; letter-spacing:1px; }
#text-body { color:#fff; font-size:58px; line-height:1.45; font-family:Georgia,serif;
             text-shadow:0 2px 16px rgba(0,0,0,.9), 0 0 40px rgba(255,255,255,.1); }
#frame-wrap { display:none; width:100%; height:100%; }
#frame-wrap iframe { width:100%; height:100%; border:none; background:transparent; }

/* Екран логотипа — замість чорноти на паузі */
#logo-layer { position:fixed; inset:0; z-index:5; display:none; align-items:center; justify-content:center; background:#000; }
#logo-layer img { max-width:55%; max-height:55%; object-fit:contain; }

/* Застиглий кадр */

/* Оголошення ПОВЕРХ живого слайда — пісня триває, повідомлення виїжджає знизу */
#alert-layer { position:fixed; left:0; right:0; bottom:0; z-index:7; display:none; padding:18px 30px;
               background:rgba(10,10,26,.88); border-top:3px solid #c8a84b; color:#fff;
               font-family:Georgia,serif; font-size:34px; text-align:center;
               transform:translateY(100%); transition:transform .45s ease; }
#alert-layer.show { transform:translateY(0); }
#alert-layer.top  { bottom:auto; top:0; border-top:none; border-bottom:3px solid #c8a84b; transform:translateY(-100%); }
#alert-layer.top.show { transform:translateY(0); }
#alert-layer.ticker { white-space:nowrap; overflow:hidden; }
#alert-layer.ticker #alert-text { display:inline-block; padding-left:100%; animation:tick 18s linear infinite; }
@keyframes tick { from { transform:translateX(0); } to { transform:translateX(-100%); } }
</style>
</head>
<body>
<video id="bg-video" muted loop playsinline></video>
<div id="proj-bg"></div>
<div id="proj-dim"></div>

<div id="content">
  <div id="text-wrap">
    <div id="text-ref"></div>
    <div id="text-body"></div>
  </div>
  <div id="frame-wrap">
    <iframe id="frame" allowtransparency="true" allow="autoplay; scripts"></iframe>
  </div>
</div>

<div id="logo-layer"><img id="logo-img" alt=""></div>
<div id="alert-layer"><span id="alert-text"></span></div>
</body>
</html>
